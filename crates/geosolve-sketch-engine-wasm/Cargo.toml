[package]
name = "geosolve-sketch-engine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"
description = "Dedicated browser and Node WASM adapter for the headless GeoSolve sketch engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geosolve-sketch-code = { version = "0.2.0", path = "../geosolve-sketch-code" }
serde.workspace = true
geosolve-sketch-engine = { version = "0.2.0", path = "../geosolve-sketch-engine" }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
console_error_panic_hook = "0.1.7"

[lints]
workspace = true
