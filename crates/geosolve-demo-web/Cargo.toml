[package]
name = "geosolve-demo-web"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Non-authoritative WASM sketch workbench for GeoSolve"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geosolve-constraint-editor = { version = "0.2.0", path = "../geosolve-constraint-editor" }
geosolve-core = { version = "0.2.0", path = "../geosolve-core" }
geosolve-sketch = { version = "0.2.0", path = "../geosolve-sketch" }
geosolve-sketch-topology = { version = "0.2.0", path = "../geosolve-sketch-topology" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "=0.2.121"
web-sys = { version = "=0.3.98", features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "Storage",
    "WheelEvent",
    "Window",
] }

[lints]
workspace = true
