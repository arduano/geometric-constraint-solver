[package]
name = "geosolve-demo-web"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Non-authoritative WASM sketch workbench for GeoSolve"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
geosolve-constraint-editor = { version = "0.2.0", path = "../geosolve-constraint-editor" }
geosolve-core = { version = "0.2.0", path = "../geosolve-core" }
geosolve-sketch = { version = "0.2.0", path = "../geosolve-sketch" }
geosolve-sketch-features = { version = "0.2.0", path = "../geosolve-sketch-features" }
geosolve-sketch-code = { version = "0.2.0", path = "../geosolve-sketch-code" }
geosolve-sketch-intent = { version = "0.2.0", path = "../geosolve-sketch-intent" }
geosolve-sketch-render = { version = "0.2.0", path = "../geosolve-sketch-render" }
miniz_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "=0.3.98"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.71"

[lints]
workspace = true
