[package]
name = "geosolve-demo-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geosolve-core = { path = "../geosolve-core" }
geosolve-geometry = { path = "../geosolve-geometry" }
geosolve-linkage = { path = "../geosolve-linkage" }
geosolve-sketch = { path = "../geosolve-sketch" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "=0.3.98"
wasm-bindgen = "=0.2.121"
web-sys = { version = "=0.3.98", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlOutputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }

[lints]
workspace = true
