<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoSolve primitive demo</title>
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <h1>GeoSolve primitive demo</h1>
          <p>Geometry and residual equations side by side.</p>
        </div>
        <label>
          Scenario
          <select id="scenario">
            <option value="triangle">Underconstrained triangle</option>
            <option value="four-bar">Four-bar linkage</option>
            <option value="slider-crank">Slider-crank</option>
          </select>
        </label>
      </header>
      <section class="workspace">
        <section class="panel geometry-panel">
          <svg id="viewport" viewBox="0 0 640 420" role="img" aria-label="Constraint solver scenario"></svg>
        </section>
        <aside class="panel audit-panel" aria-label="Constraint equation audit">
          <header class="audit-header">
            <div>
              <h2>Constraint audit</h2>
              <p>Human-readable residual rows</p>
            </div>
            <span class="scaffold-badge">scaffold</span>
          </header>
          <div id="equations"></div>
        </aside>
      </section>
      <p class="status">
        The current geometry and equations are static scaffolds. Milestones M1–M5 replace them with solved state, live variable bindings, scales and evaluated residual values.
      </p>
    </main>
  </body>
</html>
