[package]
name = "geosolve-constraint-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Headless state machine for GeoSolve constraint-editing user interfaces"
documentation = "https://docs.rs/geosolve-constraint-editor/0.2.0"
keywords = ["cad", "constraints", "editor", "geometry"]
categories = ["algorithms", "graphics"]

[dependencies]
geosolve-sketch = { version = "0.2.0", path = "../geosolve-sketch" }
geosolve-sketch-features = { version = "0.2.0", path = "../geosolve-sketch-features" }
geosolve-sketch-ops = { version = "0.2.0", path = "../geosolve-sketch-ops" }
geosolve-sketch-topology = { version = "0.2.0", path = "../geosolve-sketch-topology" }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.71"

[lints]
workspace = true
