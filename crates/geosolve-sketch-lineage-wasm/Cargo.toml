[package]
name = "geosolve-sketch-lineage-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "DOM-free JSON RPC and TypeScript boundary for GeoSolve sketch lineage"
documentation = "https://docs.rs/geosolve-sketch-lineage-wasm/0.2.0"
keywords = ["cad", "sketch", "lineage", "wasm"]
categories = ["wasm", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geosolve-constraint-editor = { version = "0.2.0", path = "../geosolve-constraint-editor" }
geosolve-sketch = { version = "0.2.0", path = "../geosolve-sketch" }
geosolve-sketch-lineage = { version = "0.2.0", path = "../geosolve-sketch-lineage" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.121"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.71"

[lints]
workspace = true
