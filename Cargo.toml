[workspace]
members = [
    "crates/geosolve-core",
    "crates/geosolve-demo-web",
    "crates/geosolve-geometry",
    "crates/geosolve-linkage",
    "crates/geosolve-sketch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"
authors = ["Leonid Shchurov"]

[workspace.dependencies]
nalgebra = "0.35.0"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
indexmap = "2.14.0"
num-dual = "0.14.1"
petgraph = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
slotmap = "1.1.1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
