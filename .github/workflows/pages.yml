name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Product qualification is the clean local release gate recorded against the
    # nominated source. This job is intentionally publication-only: rebuilding
    # that complete integration gate here made every closeout repeat the same
    # evidence before Pages could assemble an artifact.
    name: Assemble Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/f13ff45afd1bb73e640eaa08a7066dbed07e3238.tar.gz

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build the repository-prefixed Pages artifact
        env:
          GEOSOLVE_PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          GEOSOLVE_PAGES_DIST: ${{ runner.temp }}/geosolve-pages
        run: |
          set -euo pipefail
          case "$GEOSOLVE_PAGES_BASE" in
            /*) ;;
            *) printf '%s\n' "Pages base path must be absolute" >&2; exit 1 ;;
          esac
          GEOSOLVE_PUBLIC_BASE="${GEOSOLVE_PAGES_BASE%/}/"
          export GEOSOLVE_PUBLIC_BASE
          export GEOSOLVE_DIST="$GEOSOLVE_PAGES_DIST"
          # Expand Pages variables in the inner Nix shell.
          # shellcheck disable=SC2016
          nix-shell shell.nix --run '
            cd crates/geosolve-demo-web/frontend
            npm ci --ignore-scripts
            npm run check:manifest
            npm run check:licenses
            npm run test:build
            npm run build
            npm run validate:dist -- "$GEOSOLVE_DIST" "$GEOSOLVE_PUBLIC_BASE"
          '

      - name: Validate the Pages artifact
        env:
          GEOSOLVE_PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          GEOSOLVE_PAGES_DIST: ${{ runner.temp }}/geosolve-pages
        run: |
          set -euo pipefail
          GEOSOLVE_PUBLIC_BASE="${GEOSOLVE_PAGES_BASE%/}/"
          cd crates/geosolve-demo-web/frontend
          node scripts/validate-dist.mjs "$GEOSOLVE_PAGES_DIST" "$GEOSOLVE_PUBLIC_BASE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/geosolve-pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
